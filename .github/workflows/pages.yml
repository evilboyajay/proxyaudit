name: Website

# Publishes site/ to https://evilboyajay.github.io/proxyaudit/
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/proxyaudit-demo.mp4'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          cp docs/proxyaudit-demo.mp4 site/
          rm -rf site/_og

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
